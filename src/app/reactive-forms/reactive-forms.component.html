<form [formGroup]="cadastroForm" (ngSubmit)="submitForm()">

    <br>
    <br>
    <input type="text" formControlName="lastName" placeholder="Last Name">

    <p>
        {{cadastroForm.get('firstName')?.value}}
    </p>


    <button type="submit">Enviar</button>
</form>
